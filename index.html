  try{

  } catch(e){
    WHITELIST = [];
  }
}

/* Chargement de la config (XMLTV + M3U) */

  try{
    const cfg = await fetch("coulisses/config.json").then(r=>r.json());
    XML_URL = cfg.xml;
    M3U_URL = cfg.m3u;

    document.getElementById("status").textContent = "Erreur config.json";

/* Mode sombre */
function toggleDark(){
  document.body.classList.toggle("dark");
}

/* Gestion des onglets */
function showTab(id){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelector(`.tab[onclick="showTab('${id}')"]`).classList.add('active');
  document.getElementById(id).classList.add('active');
}

/* MiniTV ON/OFF */
function toggleMiniTV(){
  const box = document.getElementById("playerBox");
  if (box.style.display === "none" || box.style.display === "") {
    box.style.display = "block";
  } else {
    closeMiniTV();
  }
}

/* Fermeture propre MiniTV */
function closeMiniTV(){
  const box = document.getElementById("playerBox");
  const video = document.getElementById("player");
  video.muted = true;

  if (window.hlsPlayer) {
    try {
      window.hlsPlayer.stopLoad();
      window.hlsPlayer.detachMedia();
      window.hlsPlayer.destroy();
    } catch(e){}
    window.hlsPlayer = null;
  }

  video.pause();
  video.removeAttribute("src");
  video.load();
  box.style.display = "none";
}

/* Glisser-déposer MiniTV & Popup */
function makeDraggable(element, handle) {
  let ox = 0, oy = 0;
  handle.addEventListener("mousedown", start);
  handle.addEventListener("touchstart", start);

  function start(e) {
    e = e.touches ? e.touches[0] : e;
    ox = e.clientX - element.offsetLeft;
    oy = e.clientY - element.offsetTop;
    document.addEventListener("mousemove", move);
    document.addEventListener("touchmove", move);
    document.addEventListener("mouseup", stop);
    document.addEventListener("touchend", stop);
  }

  function move(e) {
    e = e.touches ? e.touches[0] : e;
    element.style.left = (e.clientX - ox) + "px";
    element.style.top = (e.clientY - oy) + "px";
  }

  function stop() {
    document.removeEventListener("mousemove", move);
    document.removeEventListener("touchmove", move);
    document.removeEventListener("mouseup", stop);
    document.removeEventListener("touchend", stop);
  }
}

makeDraggable(document.getElementById("playerBox"), document.getElementById("dragBar"));
makeDraggable(document.getElementById("popup"), document.getElementById("popupHeader"));

/* Lecture HLS/M3U dans la MiniTV */
function playStream(url){
  const box = document.getElementById("playerBox");
  box.style.display = "block";
  const video = document.getElementById("player");

  if(hlsPlayer){
    hlsPlayer.destroy();
    hlsPlayer = null;
  }
  if(Hls.isSupported()){
    hlsPlayer = new Hls();
    hlsPlayer.loadSource(url);
    hlsPlayer.attachMedia(video);
  } else {
    video.src = url;
  }
  video.muted = false;
  video.play();
}

/* Normalisation des IDs chaînes */
function normalizeID(id){
  if(!id) return "";
  return id
    .toLowerCase()
    .replace(/é|è|ê/g,"e")
    .replace(/à/g,"a")
    .replace(/ç/g,"c")
    .replace(/î|ï/g,"i")
    .replace(/[^a-z0-9]/g,"");
}

/* ============================================================
   CHARGEMENT M3U
   ============================================================ */
async function loadM3U(url){
  try{
    const txt = await fetch(url).then(r=>r.text());
    const lines = txt.split("\n");
    const list = [];
    let cur = {};

    lines.forEach(line=>{
      line=line.trim();

      if(line.startsWith("#EXTINF")){
        const name = line.split(",")[1]?.trim() || "";
        const logoMatch = line.match(/tvg-logo="([^"]+)"/);
        const logo = logoMatch ? logoMatch[1] : "";
        cur = {name, logo};
      }

      else if(line.startsWith("http")){
        cur.stream = line;
        list.push(cur);
        cur = {};
      }
    });

    return list;
  } catch(e){
    return [];
  }
}

/* ============================================================
   FUSION TNT + M3U
   ============================================================ */
function extendTNTwithM3U(m3uList){
  m3uList.forEach(m=>{
    const key = normalizeID(m.name);

    if(WHITELIST.length > 0){
      const name = m.name.trim().toLowerCase();
      const allowed = WHITELIST.some(w => w.trim().toLowerCase() === name);
      if(!allowed) return;
    }

    const exists = TNT.find(ch =>
      normalizeID(ch.name) === key ||
      normalizeID(ch.id) === key ||
      ch.normId === key ||
      (ch.aliases && ch.aliases.includes(key))
    );

    if(exists){
      exists.stream = m.stream;
      if(m.logo && m.logo.trim() !== "") exists.logo = m.logo;
      return;
    }

    TNT.push({
      num: TNT.length + 1,
      id: "M3U_" + key,
      normId: key,
      name: m.name,
      logo: m.logo || "coulisses/tv-blue.png",
      link: "#",
      stream: m.stream
    });
  });
}

/* ============================================================
   XMLTV — UTILITAIRES & PARSER INDIVIDUEL
   ============================================================ */
function parseDate(str){
  const m = str.match(/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})/);
  return new Date(m[1], m[2]-1, m[3], m[4], m[5], m[6]);
}

function formatTime(d){
  return d.toTimeString().slice(0,5);
}

function parseEpisodeNum(str) {
  if (!str) return "";
  const ns = str.match(/^(\d+)?\.(\d+)?/);
  if (ns) {
    let epStr = "";
    if (ns[1] !== undefined) epStr += `Saison ${parseInt(ns[1])+1} `;
    if (ns[2] !== undefined) epStr += `Épisode ${parseInt(ns[2])+1}`;
    return epStr.trim();
  }
  return str;
}

function parseSingleProgrammeNode(p) {
  const start = parseDate(p.getAttribute("start"));
  const stop = parseDate(p.getAttribute("stop"));
  const title = p.querySelector("title")?.textContent || "";
  const subTitle = p.querySelector("sub-title")?.textContent || "";
  const theme = [...p.querySelectorAll("category")].map(c=>c.textContent).join(" / ") || "";
  const desc = p.querySelector("desc")?.textContent || "";
  
  let icon = p.querySelector("icon")?.getAttribute("src") || "";
  if (icon.startsWith("http://")) icon = icon.replace("http://", "https://");

  let rawEp = p.querySelector("episode-num")?.textContent || "";
  let episode = parseEpisodeNum(rawEp);

  let rating = p.querySelector("rating value")?.textContent || p.querySelector("rating")?.textContent || "";

  const creditsNode = p.querySelector("credits");
  let credits = { directors: [], actors: [], producers: [], writers: [], adapters: [], composers: [], guests: [] };
  
  if (creditsNode) {
    credits.directors = [...creditsNode.querySelectorAll("director")].map(c=>c.textContent);
    credits.actors = [...creditsNode.querySelectorAll("actor")].map(c=>c.textContent);
    credits.producers = [...creditsNode.querySelectorAll("producer")].map(c=>c.textContent);
    credits.writers = [...creditsNode.querySelectorAll("writer")].map(c=>c.textContent);
    credits.adapters = [...creditsNode.querySelectorAll("adapter")].map(c=>c.textContent);
    credits.composers = [...creditsNode.querySelectorAll("composer")].map(c=>c.textContent);
    credits.guests = [...creditsNode.querySelectorAll("guest")].map(c=>c.textContent);
  }

  return { start, stop, title, subTitle, theme, desc, icon, episode, rating, credits };
}

function getEPGDateRange(programmes){
  const dates = [];
  for (let i = 0; i < programmes.length; i += Math.max(1, Math.floor(programmes.length / 50))) {
    const raw = programmes[i].getAttribute("start");
    if(!raw) continue;
    const clean = raw.replace(/[^0-9]/g,"").slice(0,14);
    if(clean.length===14){
      const d = parseDate(clean);
      if(!isNaN(d)) dates.push(d);
    }
  }

  if(dates.length===0) return "Programme chargé";
  dates.sort((a,b)=>a-b);

  return `Programmes du ${dates[0].toLocaleDateString("fr-FR")} au ${dates[dates.length-1].toLocaleDateString("fr-FR")}`;
}

/* ============================================================
   ONGLET SOIRÉE
   ============================================================ */
function renderEvening(channels){
  const container = document.getElementById("evening");
  const today = new Date().toLocaleDateString("fr-FR");
  const now = new Date();

  let html = `
  <div class="table-wrapper"><table>
  <thead><tr>
    <th>#</th><th>Logo</th><th>Chaîne</th><th>TV</th>
    <th>Début</th><th>Programme de la soirée</th><th>Thème</th><th>Durée</th>
    <th>Début suivant</th><th>Suivant</th><th>Progression</th>
  </tr></thead><tbody>`;

  TNT.forEach(ch=>{
    const list = channels[ch.normId];

    if(!list){
      html += `
      <tr>
        <td>${ch.num}</td>
        <td><img class="logo" src="${ch.logo}" onclick="openFullProgramForChannel('${ch.normId}')"></td>
        <td><a href="${ch.link}" target="_blank" style="font-weight:bold;">${ch.name}</a></td>
        <td>${ch.stream ? `<img src="coulisses/tv-blue.png" onclick="playStream('${ch.stream}')" style="height:58px;width:58px;cursor:pointer;">` : ""}</td>
        <td colspan="7" style="text-align:center;color:#888;">Pas de données XMLTV</td>
      </tr>`;
      return;
    }

    let evening = list.find(p=>{
      const date = p.start.toLocaleDateString("fr-FR");
      if(date!==today) return false;

      const h = p.start.getHours(), m = p.start.getMinutes();
      const minutes = h*60+m;
      const duration = (p.stop-p.start)/60000;

      return minutes>=1245 && minutes<=1290 && duration>=45;
    }) || list.find(p=>{
      const date = p.start.toLocaleDateString("fr-FR");
      if(date!==today) return false;

      const h = p.start.getHours(), m = p.start.getMinutes();
      const minutes = h*60+m;
      const duration = (p.stop-p.start)/60000;

      return minutes>=1230 && duration>=20;
    });

    let next = null;
    if(evening){
      const idx = list.indexOf(evening);
      next = list[idx+1] || null;
    }

    if(!evening){
      html += `
      <tr>
        <td>${ch.num}</td>
        <td><img class="logo" src="${ch.logo}" onclick="openFullProgramForChannel('${ch.normId}')"></td>
        <td><a href="${ch.link}" target="_blank" style="font-weight:bold;">${ch.name}</a></td>
        <td>${ch.stream ? `<img src="coulisses/tv-blue.png" onclick="playStream('${ch.stream}')" style="height:58px;width:58px;cursor:pointer;">` : ""}</td>
        <td colspan="7" style="text-align:center;color:#888;">Aucun programme soirée</td>
      </tr>`;
      return;
    }

    const duration = Math.round((evening.stop-evening.start)/60000);
    const progress = Math.min(100, Math.max(0,
      ((now-evening.start)/(evening.stop-evening.start))*100));

    let eveningIcon = evening.icon;
    let nextIcon = next ? next.icon : "";

    const eveningImgHtml = eveningIcon 
      ? `<img src="${eveningIcon}" style="height:60px; border-radius:6px;">` 
      : `<span style="color:red; font-size:11px;">(Pas d'image dans le XMLTV)</span>`;

    const nextImgHtml = nextIcon 
      ? `<img src="${nextIcon}" style="height:60px; border-radius:6px;">` 
      : (next ? `<span style="color:red; font-size:11px;">(Pas d'image dans le XMLTV)</span>` : "");

    html += `
    <tr>
      <td>${ch.num}</td>
      <td><img class="logo" src="${ch.logo}" onclick="openFullProgramForChannel('${ch.normId}')"></td>
      <td><a href="${ch.link}" target="_blank" style="font-weight:bold;">${ch.name}</a></td>
      <td>${ch.stream ? `<img src="coulisses/tv-blue.png" onclick="playStream('${ch.stream}')" style="height:58px;width:58px;cursor:pointer;">` : ""}</td>
      <td>${formatTime(evening.start)}</td>

      <td class="popup-evening"
          data-chan="${ch.normId}"
          data-idx="${list.indexOf(evening)}"
          style="cursor:pointer;">
        <div style="display:flex; align-items:center; gap:10px;">
          ${eveningImgHtml}
          <span>${evening.title}</span>
        </div>
      </td>

      <td>${evening.theme}</td>
      <td>${duration} min</td>
      <td>${next?formatTime(next.start):"—"}</td>

      <td class="popup-evening"
          data-chan="${ch.normId}"
          data-idx="${next ? list.indexOf(next) : -1}"
          style="cursor:pointer;">
        <div style="display:flex; align-items:center; gap:10px;">
          ${nextImgHtml}
          <span>${next ? next.title : "—"}</span>
        </div>
      </td>

      <td><div class="bar"><div class="fill" style="width:${progress}%"></div></div></td>
    </tr>`;
  });

  html += "</tbody></table></div>";
  container.innerHTML = html;
}

/* ============================================================
   LAZY LOADING : SEMAINE COMPLÈTE À LA DEMANDE (CLIC CHAÎNE)
   ============================================================ */
function openFullProgramForChannel(normId) {
  const ch = TNT.find(c => c.normId === normId);
  if (!ch || !xmlDocCache) return;

  // Extraction rapide des 7 jours UNIQUEMENT pour la chaîne sélectionnée
  const programmesNodes = xmlDocCache.querySelectorAll("programme");
  const fullList = [];

  for (let i = 0; i < programmesNodes.length; i++) {
    const p = programmesNodes[i];
    if (normalizeID(p.getAttribute("channel")) === normId) {
      fullList.push(parseSingleProgrammeNode(p));
    }
  }

  let html = `
  <h3>Programme complet (7 jours) – <a href="${ch.link}" target="_blank" style="font-weight:bold;">${ch.name}</a></h3>
  <input id="searchProg" type="text" placeholder="Rechercher une émission / film..." 
         style="padding:6px; width:100%; margin-bottom:12px; font-size:14px;"
         oninput="filterFullPrograms()">
  <div id="view-full">`;

  if (fullList.length === 0) {
    html += `<p style="color:#888;">Aucune donnée XMLTV disponible pour cette chaîne.</p>`;
  } else {
    fullList.sort((a, b) => a.start - b.start);

    fullList.forEach(p => {
      html += `
      <div class="prog-item" style="margin-bottom:12px; display:flex; align-items:center; gap:12px;">
        ${p.icon ? `<img src="${p.icon}" style="height:60px; border-radius:6px; object-fit:cover;" onerror="this.style.display='none'">` : ""}
        <div>
          <strong>${p.start.toLocaleDateString("fr-FR")}</strong> 
          ${formatTime(p.start)}–${formatTime(p.stop)} 
          (${Math.round((p.stop - p.start) / 60000)} min)
          <br><em class="prog-title">${p.title}</em> ${p.episode ? `<span style="font-size:11px; background:#444; padding:2px 4px; border-radius:3px;">${p.episode}</span>` : ''}
          <br><span class="prog-desc" style="color:#666; font-size:12px;">${p.theme} ${p.desc ? ' - ' + p.desc : ''}</span>
        </div>
      </div>`;
    });
  }

  html += "</div>";

  document.getElementById("full").innerHTML = html;

  const tab = document.getElementById("tab-full");
  tab.style.display = "inline-block";
  tab.textContent = "Complet – " + ch.name;

  showTab("full");
}

function filterFullPrograms(){
  const query = document.getElementById("searchProg").value.toLowerCase().trim();
  document.querySelectorAll("#view-full .prog-item").forEach(item => {
    const text = item.textContent.toLowerCase();
    item.style.display = text.includes(query) ? "flex" : "none";
  });
}

/* ============================================================
   RECHERCHE / FILTRE CHAÎNES
   ============================================================ */
function filterChannels(){
  const q = document.getElementById("search").value.toLowerCase().trim();

  document.querySelectorAll("#tv tbody tr").forEach(row=>{
    const nameCell = row.querySelector("td:nth-child(3)");
    if(!nameCell) return;
    row.style.display = nameCell.textContent.toLowerCase().includes(q) ? "" : "none";
  });

  document.querySelectorAll("#evening tbody tr").forEach(row=>{
    const nameCell = row.querySelector("td:nth-child(3)");
    if(!nameCell) return;
    row.style.display = nameCell.textContent.toLowerCase().includes(q) ? "" : "none";
  });
}

document.getElementById("search").addEventListener("input", filterChannels);

/* ============================================================
   UPDATE TV — CHARGEMENT INITIAL ULTRA-RAPIDE (AUJOURD'HUI)
   ============================================================ */
async function updateTV(){
  try{
    document.getElementById("status").textContent = "Chargement EPG...";
    const xmlTxt = await fetch(XML_URL+"?t="+Date.now()).then(r=>r.text());
    xmlDocCache = new DOMParser().parseFromString(xmlTxt,"application/xml");

    const programmesNodes = xmlDocCache.querySelectorAll("programme");
    const channelsToday = {};

    const now = new Date();
    const todayStr = now.toLocaleDateString("fr-FR");

    // Extraction rapide : uniquement aujourd'hui pour l'affichage initial
    for (let i = 0; i < programmesNodes.length; i++) {
      const p = programmesNodes[i];
      const rawStart = p.getAttribute("start");
      if (!rawStart) continue;

      const start = parseDate(rawStart);
      if (start.toLocaleDateString("fr-FR") === todayStr) {
        const id = normalizeID(p.getAttribute("channel"));
        if (!channelsToday[id]) channelsToday[id] = [];
        channelsToday[id].push(parseSingleProgrammeNode(p));
      }
    }

    document.getElementById("status").textContent = getEPGDateRange(programmesNodes);

    renderXMLChannels(channelsToday);
    renderEvening(channelsToday);

    const tbody = document.querySelector("#tv tbody");
    tbody.innerHTML = "";

    TNT.forEach(ch=>{
      const list = channelsToday[ch.normId];

      if(!list){
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${ch.num}</td>
          <td><img class="logo" src="${ch.logo}" onclick="openFullProgramForChannel('${ch.normId}')"></td>
          <td><a href="${ch.link}" target="_blank" style="font-weight:bold;">${ch.name}</a></td>
          <td>${ch.stream ? `
              <img src="coulisses/tv-blue.png"
                   onclick="playStream('${ch.stream}')"
                   style="height:58px;width:58px;cursor:pointer;">
          ` : ""}</td>
          <td colspan="7" style="text-align:center;color:#888;">Pas de données XMLTV</td>
        `;
        tbody.appendChild(tr);
        return;
      }

      list.sort((a,b)=>a.start-b.start);

      let current = null, next = null;

      for(let i=0;i<list.length;i++){
        if(list[i].start <= now && list[i].stop > now){
          current = list[i];
          next = list[i+1] || null;
          break;
        }
      }

      if(!current){
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${ch.num}</td>
          <td><img class="logo" src="${ch.logo}" onclick="openFullProgramForChannel('${ch.normId}')"></td>
          <td><a href="${ch.link}" target="_blank" style="font-weight:bold;">${ch.name}</a></td>
          <td>${ch.stream ? `
              <img src="coulisses/tv-blue.png"
                   onclick="playStream('${ch.stream}')"
                   style="height:58px;width:58px;cursor:pointer;">
          ` : ""}</td>
          <td colspan="7" style="text-align:center;color:#888;">Aucun programme en cours</td>
        `;
        tbody.appendChild(tr);
        return;
      }

      const duration = Math.round((current.stop - current.start) / 60000);
      const progress = Math.min(100, Math.max(0,
        ((now - current.start) / (current.stop - current.start)) * 100));

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${ch.num}</td>

        <td><img class="logo" src="${ch.logo}" onclick="openFullProgramForChannel('${ch.normId}')"></td>

        <td><a href="${ch.link}" target="_blank" style="font-weight:bold;">${ch.name}</a></td>

        <td>${ch.stream ? `
            <img src="coulisses/tv-blue.png"
                 onclick="playStream('${ch.stream}')"
                 style="height:58px;width:58px;cursor:pointer;">
        ` : ""}</td>

        <td>${formatTime(current.start)}</td>

        <td class="popup-now"
            data-chan="${ch.normId}"
            data-idx="${list.indexOf(current)}"
            style="cursor:pointer;">
          <div style="display:flex; align-items:center; gap:10px;">
            ${current && current.icon ? `<img src="${current.icon}" style="height:60px; border-radius:6px;" onerror="this.style.display='none'">` : ""}
            <span>${current ? current.title : ""}</span>
          </div>
        </td>

        <td>${current.theme}</td>
        <td>${duration} min</td>

        <td>${next ? formatTime(next.start) : ""}</td>

        <td class="popup-now"
            data-chan="${ch.normId}"
            data-idx="${next ? list.indexOf(next) : -1}"
            style="cursor:pointer;">
          <div style="display:flex; align-items:center; gap:10px;">
            ${next && next.icon ? `<img src="${next.icon}" style="height:60px; border-radius:6px;" onerror="this.style.display='none'">` : ""}
            <span>${next ? next.title : ""}</span>
          </div>
        </td>

        <td>
          <div class="bar">
            <div class="fill" style="width:${progress}%"></div>
          </div>
        </td>
      `;
      tbody.appendChild(tr);
    });

    document.querySelectorAll(".popup-now").forEach(cell=>{
      const chan = cell.dataset.chan;
      const idx = parseInt(cell.dataset.idx, 10);

      if(!channelsToday[chan]) return;
      if(!channelsToday[chan][idx]) return;

      const prog = channelsToday[chan][idx];
      cell.addEventListener("click", ()=>showProgramPopup(prog));
    });

    document.querySelectorAll(".popup-evening").forEach(cell=>{
      const chan = cell.dataset.chan;
      const idx = parseInt(cell.dataset.idx, 10);

      if(!channelsToday[chan]) return;
      if(!channelsToday[chan][idx]) return;

      const prog = channelsToday[chan][idx];
      cell.addEventListener("click", ()=>showProgramPopup(prog));
    });

  } catch(e){
    console.error(e);
    document.getElementById("status").textContent = "Erreur de chargement";
  }
}

/* ============================================================
   BOUCLE AUTO + FUSION M3U
   ============================================================ */
(async ()=>{
  await loadConfig();
  await loadWhitelist();

  try{
    const m3u = await loadM3U(M3U_URL);
    extendTNTwithM3U(m3u);
  } catch(e){}

  updateTV();
  setInterval(updateTV, 60000);
})();

/* ============================================================
   POP-UP PROGRAMME DÉTAILLÉ
   ============================================================ */
function showProgramPopup(prog){
  let detailsHtml = "";

  if (prog.subTitle) {
    detailsHtml += `<p style="font-style:italic; font-size:15px; margin-top:-5px; color:#ddd;">${prog.subTitle}</p>`;
  }

  detailsHtml += `<p><b>Horaire :</b> ${formatTime(prog.start)} – ${formatTime(prog.stop)} (${Math.round((prog.stop-prog.start)/60000)} min)</p>`;
  
  if (prog.episode) detailsHtml += `<p><b>Épisode :</b> ${prog.episode}</p>`;
  if (prog.theme) detailsHtml += `<p><b>Thème :</b> ${prog.theme}</p>`;
  if (prog.rating) detailsHtml += `<p><b>Classification :</b> ${prog.rating}</p>`;

  /* Construction du bloc Crédits */
  let creditsHtml = "";
  if (prog.credits) {
    const c = prog.credits;
    if (c.directors.length) creditsHtml += `<p><b>Réalisation :</b> ${c.directors.join(", ")}</p>`;
    if (c.actors.length) creditsHtml += `<p><b>Avec :</b> ${c.actors.join(", ")}</p>`;
    if (c.guests.length) creditsHtml += `<p><b>Invités :</b> ${c.guests.join(", ")}</p>`;
    if (c.writers.length) creditsHtml += `<p><b>Scénario :</b> ${c.writers.join(", ")}</p>`;
    if (c.producers.length) creditsHtml += `<p><b>Production :</b> ${c.producers.join(", ")}</p>`;
    if (c.composers.length) creditsHtml += `<p><b>Musique :</b> ${c.composers.join(", ")}</p>`;
  }

  const html = `
    <h2 style="margin-top:0; color:#4caf50;">${prog.title}</h2>
    ${detailsHtml}
    ${prog.icon ? `<img src="${prog.icon}" style="max-width:100%; max-height:250px; display:block; margin:12px 0; border-radius:6px; object-fit:contain;" onerror="this.style.display='none'">` : ""}
    ${creditsHtml}
    <p><b>Résumé :</b><br><span style="line-height:1.4; color:#ccc;">${prog.desc || "Aucune description disponible."}</span></p>
  `;

  document.getElementById("popupContent").innerHTML = html;
  document.getElementById("popup").style.display = "block";
}

function closePopup(){
  document.getElementById("popup").style.display = "none";
}
