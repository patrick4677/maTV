name: Mise a jour automatique EPG INA 70

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code du depot
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Executer le script de generation
        run: python generate_ina70.py

      - name: Commit et Push des modifications
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add coulisses/ina70.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update INA 70 EPG" && git push)
