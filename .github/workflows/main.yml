name: Mise a jour du XML EPG et m3u

on:
  schedule:
    - cron: '0 4 * * *' # S'exécute tous les jours à 4h du matin
  workflow_dispatch: # Permet de le lancer manuellement

jobs:
  update-xml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Configuration de Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Créer le dossier coulisses si inexistant
        run: mkdir -p coulisses

      - name: Télécharger le fichier XML
        run: |
          curl -s https://xmltvfr.fr/xmltv/xmltv_tnt.xml -o coulisses/xmltv_tnt.xml

      - name: Optimiser le fichier XML (Conservation des chaines + filtrage programmes)
        run: |
          python -c '
          import xml.etree.ElementTree as ET
          from datetime import datetime, timedelta, timezone

          file_path = "coulisses/xmltv_tnt.xml"
          print("Début du filtrage sécurisé de xmltv_tnt.xml...")
          
          tree = ET.parse(file_path)
          root = tree.getroot()

          now = datetime.now(timezone.utc)
          # Plage : 12h dans le passé à 72h dans le futur
          min_date = now - timedelta(hours=12)
          max_date = now + timedelta(days=3)

          kept, removed = 0, 0

          # On parcourt uniquement les balises programme (les balises channel restent intactes)
          for prog in root.findall("programme"):
              start_str = prog.get("start")
              if start_str:
                  try:
                      clean_date = start_str.split()[0]
                      dt_prog = datetime.strptime(clean_date, "%Y%m%d%H%M%S").replace(tzinfo=timezone.utc)
                      if not (min_date <= dt_prog <= max_date):
                          root.remove(prog)
                          removed += 1
                      else:
                          kept += 1
                  except Exception:
                      # En cas de doute sur la date, on conserve le programme
                      kept += 1

          tree.write(file_path, encoding="utf-8", xml_declaration=True)
          print(f"Optimisation terminée : {kept} programmes conservés, {removed} supprimés.")
          '

      - name: Télécharger le fichier M3U (Simulation Navigateur)
        run: |
          curl -sL -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" \
               -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
               -H "Accept-Language: fr,fr-FR;q=0.9,en-US;q=0.8,en;q=0.7" \
               "https://tvradiozap.eu/live/d/tvzeu.m3u" -o coulisses/tvrz.m3u

      - name: Vérifier la taille du M3U
        run: |
          lines=$(wc -l < coulisses/tvrz.m3u)
          echo "Nombre de lignes dans le M3U : $lines"

      - name: Sauvegarder les modifications
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add coulisses/xmltv_tnt.xml coulisses/tvrz.m3u
          git commit -m "Mise à jour et optimisation automatique du XML et M3U" || exit 0
          git push
