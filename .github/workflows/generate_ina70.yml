name: Generate INA70 EPG

on:
  schedule:
    # Déclenchement automatique toutes les 3 heures
    - cron: '0 */3 * * *'
  # Permet aussi de déclencher le script manuellement depuis GitHub
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Run script
      run: python generate_ina70.py

    - name: Commit and Push XML
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add coulisses/ina70.xml
        git commit -m "Automated EPG update: INA70" || exit 0
        git push